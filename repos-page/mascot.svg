<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
<!-- The site's mascot: a little blue rose sprite (site.css). Original drawing. -->
<defs>
<radialGradient id="bloom" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#8fb0ff"/><stop offset=".55" stop-color="#3f6cff"/><stop offset="1" stop-color="#1c38b8"/></radialGradient>
<radialGradient id="petal" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#b5c9ff"/><stop offset=".6" stop-color="#5a82ff"/><stop offset="1" stop-color="#2647c9"/></radialGradient>
<radialGradient id="face" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#fff7fb"/><stop offset="1" stop-color="#e6e9ff"/></radialGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0c0"/><stop offset="1" stop-color="#1f7f8f"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5a82ff" stop-opacity=".45"/><stop offset="1" stop-color="#5a82ff" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="70" cy="74" r="62" fill="url(#glow)"/>
<!-- feet -->
<ellipse cx="57" cy="122" rx="9" ry="6" fill="#1f7f8f"/>
<ellipse cx="83" cy="122" rx="9" ry="6" fill="#1f7f8f"/>
<!-- leaf arms -->
<path d="M30 86C14 84 6 72 8 60 22 62 32 72 36 82Z" fill="url(#leaf)"/>
<path d="M14 64C22 70 28 76 33 83" fill="none" stroke="#bff3ea" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>
<path d="M110 86C126 84 134 72 132 60 118 62 108 72 104 82Z" fill="url(#leaf)"/>
<path d="M126 64C118 70 112 76 107 83" fill="none" stroke="#bff3ea" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>
<!-- outer petals (the body) -->
<g fill="url(#petal)" stroke="#c9d6ff" stroke-opacity=".55" stroke-width="1.5">
<circle cx="40" cy="62" r="20"/>
<circle cx="100" cy="62" r="20"/>
<circle cx="52" cy="40" r="20"/>
<circle cx="88" cy="40" r="20"/>
<circle cx="70" cy="32" r="20"/>
</g>
<circle cx="70" cy="80" r="40" fill="url(#bloom)" stroke="#c9d6ff" stroke-opacity=".5" stroke-width="1.5"/>
<!-- swirl on top, like a rose's centre -->
<path d="M70 40c6-2 11 2 10 7s-8 6-11 2 0-10 7-11 13 4 12 12" fill="none" stroke="#e6edff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/>
<path d="M50 52c5-6 13-9 20-9M90 52c-5-6-13-9-20-9" fill="none" stroke="#c9d6ff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
<!-- face -->
<ellipse cx="70" cy="88" rx="27" ry="23" fill="url(#face)"/>
<ellipse cx="59" cy="86" rx="5.2" ry="7" fill="#0f1640"/>
<ellipse cx="81" cy="86" rx="5.2" ry="7" fill="#0f1640"/>
<circle cx="61" cy="83" r="2.2" fill="#fff"/>
<circle cx="83" cy="83" r="2.2" fill="#fff"/>
<circle cx="57.5" cy="89.5" r="1" fill="#fff" opacity=".8"/>
<circle cx="79.5" cy="89.5" r="1" fill="#fff" opacity=".8"/>
<ellipse cx="51" cy="96" rx="5" ry="3" fill="#ff8fb8" opacity=".55"/>
<ellipse cx="89" cy="96" rx="5" ry="3" fill="#ff8fb8" opacity=".55"/>
<path d="M66 97c2 3 6 3 8 0" fill="none" stroke="#0f1640" stroke-width="1.8" stroke-linecap="round"/>
<!-- sparkles -->
<path d="M120 22l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#e8c77f"/>
<path d="M18 30l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#e8c77f" opacity=".85"/>
</svg>
