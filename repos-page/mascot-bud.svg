<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
<!-- The mascot's little sibling: a waving blue rosebud (site.css). Original drawing. -->
<defs>
<radialGradient id="bud" cx="45%" cy="35%" r="75%"><stop offset="0" stop-color="#a9c0ff"/><stop offset=".55" stop-color="#4a74ff"/><stop offset="1" stop-color="#1d3ab8"/></radialGradient>
<radialGradient id="face" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#fff7fb"/><stop offset="1" stop-color="#e6e9ff"/></radialGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0c0"/><stop offset="1" stop-color="#1f7f8f"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#5a82ff" stop-opacity=".4"/><stop offset="1" stop-color="#5a82ff" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="70" cy="78" r="58" fill="url(#glow)"/>
<!-- feet -->
<ellipse cx="59" cy="124" rx="8" ry="5.5" fill="#1f7f8f"/>
<ellipse cx="81" cy="124" rx="8" ry="5.5" fill="#1f7f8f"/>
<!-- arms: the right one waving -->
<path d="M40 96C26 98 18 92 16 84 28 82 36 86 42 92Z" fill="url(#leaf)"/>
<path d="M98 84C108 72 118 64 128 64 128 76 118 86 102 90Z" fill="url(#leaf)"/>
<path d="M122 68C114 74 108 80 104 87" fill="none" stroke="#bff3ea" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
<path d="M128 52a8 8 0 0 1 4 8M134 46a14 14 0 0 1 5 14" fill="none" stroke="#e8c77f" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<!-- the bud -->
<path d="M70 18C98 36 108 70 98 96 90 116 50 116 42 96 32 70 42 36 70 18Z" fill="url(#bud)" stroke="#c9d6ff" stroke-opacity=".5" stroke-width="1.5"/>
<path d="M70 18C60 34 58 50 66 62M70 18C84 30 90 46 84 60" fill="none" stroke="#d6e1ff" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round"/>
<!-- sepals wrapping the bottom -->
<path d="M42 96C40 84 44 74 52 68 56 82 56 96 70 110 56 112 46 106 42 96Z" fill="url(#leaf)"/>
<path d="M98 96C100 84 96 74 88 68 84 82 84 96 70 110 84 112 94 106 98 96Z" fill="url(#leaf)"/>
<!-- face -->
<ellipse cx="70" cy="86" rx="20" ry="17" fill="url(#face)"/>
<ellipse cx="62" cy="84" rx="4.2" ry="5.6" fill="#0f1640"/>
<circle cx="63.6" cy="81.6" r="1.8" fill="#fff"/>
<path d="M74 85c2-4 7-4 9 0" fill="none" stroke="#0f1640" stroke-width="2.2" stroke-linecap="round"/>
<ellipse cx="56" cy="92" rx="4" ry="2.4" fill="#ff8fb8" opacity=".55"/>
<ellipse cx="85" cy="92" rx="4" ry="2.4" fill="#ff8fb8" opacity=".55"/>
<path d="M66 93c1.5 4 6.5 4 8 0z" fill="#0f1640"/>
<!-- a tiny heart -->
<path d="M28 40c-3-5-11-3-9 3 1 4 9 9 9 9s8-5 9-9c2-6-6-8-9-3z" fill="#ff8fb8" opacity=".85"/>
</svg>
